name: Publicar agora

# Um ciclo avulso (o relógio já faz isso a cada 5 minutos).
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: relogio-ciclo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JoeversonSK/jn-marketing
          token: ${{ secrets.DADOS_TOKEN }}
          path: dados
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ciclo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MIDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/midia
          JN_DADOS: ${{ github.workspace }}/dados
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ciclo.sh
